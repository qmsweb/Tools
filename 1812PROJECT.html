<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .countdown {
            font-size: 24px;
            color: #333;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="countdown" id="countdown">0</div>

    <script>
        // عداد تنازلي
        let seconds = 0;
        const countdownElement = document.getElementById('countdown');
        
        const countdown = setInterval(() => {
            seconds--;
            countdownElement.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = "https://1812.jassim.one";
            }
        }, 1000);
    </script>
</body>
</html>
