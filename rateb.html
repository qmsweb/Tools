<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المتبقي على الراتب</title>
  <style>
    body {
      font-family: "Tahoma", sans-serif;
      background: linear-gradient(135deg, #1a73e8, #4cafef);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 15px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 25px;
    }
    .countdown {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }
    .time-box {
      background: rgba(0,0,0,0.25);
      padding: 12px;
      border-radius: 10px;
      min-width: 70px;
      flex: 1 1 70px;
      max-width: 100px;
    }
    .time {
      font-size: 28px;
      font-weight: bold;
      display: block;
    }
    .label {
      font-size: 14px;
      margin-top: 5px;
      opacity: 0.9;
      display: block;
    }
    .date {
      margin-top: 20px;
      font-size: 16px;
      opacity: 0.95;
    }
    @media (max-width: 480px) {
      h1 { font-size: 22px; }
      .time { font-size: 22px; }
      .label { font-size: 13px; }
    }
  </style>
</head>
<body>
  <h1>⏳ المتبقي على الراتب</h1>
  <div class="countdown" id="countdown"></div>
  <div class="date" id="salary-date"></div>

  <script>
    function getNextSalaryDate() {
      let today = new Date();
      let year = today.getFullYear();
      let month = today.getMonth();

      let salaryDate = new Date(year, month, 23);

      if (salaryDate < today) {
        month++;
        salaryDate = new Date(year, month, 23);
      }

      let day = salaryDate.getDay();
      if (day === 5) salaryDate.setDate(22);
      else if (day === 6) salaryDate.setDate(21);

      return salaryDate;
    }

    function updateCountdown() {
      let now = new Date();
      let salaryDate = getNextSalaryDate();
      let diff = salaryDate - now;
      let container = document.getElementById("countdown");

      if (diff <= 0) {
        container.innerHTML = "<div class='time-box'><span class='time'>اليوم 🎉</span><span class='label'>يوم الراتب</span></div>";
        return;
      }

      let days = Math.floor(diff / (1000 * 60 * 60 * 24));
      let hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      let minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      let seconds = Math.floor((diff % (1000 * 60)) / 1000);

      container.innerHTML = `
        <div class="time-box">
          <span class="time">${days}</span>
          <span class="label">يوم</span>
        </div>
        <div class="time-box">
          <span class="time">${hours}</span>
          <span class="label">ساعة</span>
        </div>
        <div class="time-box">
          <span class="time">${minutes}</span>
          <span class="label">دقيقة</span>
        </div>
        <div class="time-box">
          <span class="time">${seconds}</span>
          <span class="label">ثانية</span>
        </div>
      `;

      // عرض اليوم + التاريخ
      let options = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
      document.getElementById("salary-date").innerText =
        "📅 موعد الراتب القادم: " + salaryDate.toLocaleDateString("ar-EG", options);
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
