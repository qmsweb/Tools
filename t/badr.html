<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الهروب وجمع الفلافل</title>
    <style>
        /* إعدادات الصفحة الأساسية */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        /* ========== شاشة التحميل (Loading Screen) ========== */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #loading-screen .loader-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 25px;
        }
        #loading-screen .loader-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: bounce 0.8s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0px); }
            to { transform: translateY(-12px); }
        }
        #loading-screen .loading-text {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 18px;
            letter-spacing: 1px;
        }
        /* حاوية شريط التقدم */
        #loading-screen .progress-bar-bg {
            width: 260px;
            height: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
        }
        #loading-screen .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #C66135, #ffd700, #C66135);
            background-size: 200% 100%;
            border-radius: 20px;
            animation: shimmer 1.5s infinite linear;
            transition: width 0.3s ease;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        #loading-screen .progress-percent {
            font-size: 16px;
            margin-top: 12px;
            color: rgba(255,255,255,0.8);
            font-weight: bold;
        }

        /* حاوية الفلافل (أعلى يمين الشاشة - مستديرة) */
        #falafel-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 10px 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            z-index: 10;
            font-size: 22px;
            font-weight: bold;
        }
        #falafel-container img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }
        #falafel-container span {
            color: #ffd700;
        }

        /* النقاط (أسفل الفلافل - بدون حاوية) */
        #score-container {
            position: absolute;
            top: 90px;
            right: 40px;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        #score-container span {
            color: #C66135;
        }

        /* شاشة نهاية اللعبة (الخسارة) */
        #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(127, 40, 143, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            display: none;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            z-index: 20;
        }
        #gameOverScreen h1 {
            margin-top: 0;
            color: #ff4757;
            font-size: 28px;
        }
        button {
            background: linear-gradient(45deg, #7F288F, #C66135);
            border: none;
            border-radius: 12px;
            padding: 12px 25px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        canvas {
            display: block;
        }
        /* رسالة توجيهية للمستخدم */
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            opacity: 0.7;
            font-size: 18px;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- ========== شاشة التحميل (Loading Screen) ========== -->
    <div id="loading-screen">
        <div class="loader-icon">
            <!-- أيقونة فلافل صغيرة ترتد -->
            <img src="images/coin.png" alt="loading" onerror="this.style.display='none'">
        </div>
        <div class="loading-text">جاري التحميل...</div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="progress-percent" id="progressPercent">0%</div>
    </div>

    <!-- الواجهة الجديدة -->
    <div id="falafel-container">
        الفلافل 
        <img src="images/coin.png" alt="coin"> 
        <span id="coinVal">0</span>
    </div>
    
    <div id="score-container">
        النقاط: <span id="scoreVal">0</span>
    </div>

    <!-- شاشة الخسارة المحدثة -->
    <div id="gameOverScreen">
        <h1>لقد أمسك أهل شعنزي بالسيد بدر</h1>
        <p style="font-size: 20px; font-weight: bold;">جمعت <span id="finalCoins" style="color: #ffd700;">0</span> من الفلافل</p>
        <button onclick="resetGame()">العب مرة أخرى</button>
    </div>

    <div id="instructions">اضغط على زر المسافة (Space) أو المس الشاشة للقفز</div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // ========== نظام التحميل ==========
        const loadingScreen = document.getElementById('loading-screen');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');

        // قائمة الصور المطلوب تحميلها
        const imagesToLoad = [
            'images/player1.png',
            'images/player2.png',
            'images/coin.png'
        ];

        let loadedCount = 0;
        const totalImages = imagesToLoad.length;

        // تحديث شريط التقدم
        function updateProgress() {
            const percent = Math.round((loadedCount / totalImages) * 100);
            progressFill.style.width = percent + '%';
            progressPercent.textContent = percent + '%';
        }

        // إنشاء كائنات Image والبدء بتحميلها
        const preloadedImages = {};
        imagesToLoad.forEach((src) => {
            const img = new Image();
            img.onload = () => {
                loadedCount++;
                updateProgress();
                if (loadedCount === totalImages) {
                    startGameAfterLoading();
                }
            };
            img.onerror = () => {
                // حتى لو فشل التحميل، نكمل العد حتى لا نعلق للأبد
                loadedCount++;
                updateProgress();
                console.warn('تعذر تحميل الصورة: ' + src);
                if (loadedCount === totalImages) {
                    startGameAfterLoading();
                }
            };
            img.src = src;
            preloadedImages[src] = img;
        });

        // عند اكتمال تحميل جميع الصور
        function startGameAfterLoading() {
            // تأخير بسيط ليرى المستخدم 100%
            setTimeout(() => {
                // إخفاء شاشة التحميل بتأثير fade
                loadingScreen.classList.add('hidden');
                // بدء اللعبة
                startGame();
            }, 400);
        }

        // ========== اللعبة نفسها ==========
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // إعداد حجم الشاشة
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // المتغيرات الأساسية للعبة
        let gameSpeed = 4.5;
        let gravity = 0.6;
        let score = 0;
        let coinsCollected = 0;
        let isGameOver = false;
        let animationFrameId;
        let gameStarted = false;

        // الصور (سنستخدم الصور التي تم تحميلها مسبقاً)
        const images = {
            player1: preloadedImages['images/player1.png'],
            player2: preloadedImages['images/player2.png'],
            coin: preloadedImages['images/coin.png']
        };

        // كائن الشخصية (اللاعب)
        const player = {
            x: 100,
            y: 0,
            width: 60,
            height: 80,
            dy: 0,
            jumpForce: -14,
            grounded: false,
            runFrame: 1,
            frameTimer: 0,
            
            draw() {
                this.frameTimer++;
                if (this.frameTimer % 10 === 0 && this.grounded) {
                    this.runFrame = this.runFrame === 1 ? 2 : 1;
                } else if (!this.grounded) {
                    this.runFrame = 1;
                }

                const currentImage = this.runFrame === 1 ? images.player1 : images.player2;

                if (currentImage && currentImage.complete && currentImage.naturalHeight !== 0) {
                    let aspect = currentImage.naturalWidth / currentImage.naturalHeight;
                    this.height = 80;
                    this.width = 80 * aspect;
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(currentImage, this.x, this.y, this.width, this.height);
                } else {
                    ctx.fillStyle = '#C66135';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }
            },
            
            update() {
                if (!this.grounded) {
                    this.dy += gravity;
                }
                this.y += this.dy;

                const groundLevel = canvas.height - 100 - this.height;
                if (this.y >= groundLevel) {
                    this.y = groundLevel;
                    this.dy = 0;
                    this.grounded = true;
                } else {
                    this.grounded = false;
                }
                this.draw();
            },
            
            jump() {
                if (this.grounded) {
                    this.dy = this.jumpForce;
                    this.grounded = false;
                }
            }
        };

        let obstacles = [];
        let coins = [];

        class Obstacle {
            constructor() {
                this.width = 35;
                this.height = Math.random() * 25 + 30;
                this.x = canvas.width;
                this.y = canvas.height - 100 - this.height;
            }
            draw() {
                ctx.fillStyle = '#ff4757'; 
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
            update() {
                this.x -= gameSpeed;
                this.draw();
            }
        }

        class Coin {
            constructor() {
                this.width = 30;
                this.height = 30;
                this.x = canvas.width;
                this.y = canvas.height - 140 - Math.random() * 120;
                this.collected = false;
            }
            draw() {
                if (images.coin && images.coin.complete && images.coin.naturalHeight !== 0) {
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(images.coin, this.x, this.y, this.width, this.height);
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffd700';
                    ctx.fill();
                    ctx.closePath();
                }
            }
            update() {
                this.x -= gameSpeed;
                if (!this.collected) this.draw();
            }
        }

        let spawnTimer = 0;
        function handleElements() {
            spawnTimer++;
            
            if (spawnTimer % 160 === 0) {
                obstacles.push(new Obstacle());
            }
            
            if (spawnTimer % 90 === 0) {
                coins.push(new Coin());
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.update();
                
                let hitTolerance = 8; 
                if (player.x + hitTolerance < obs.x + obs.width &&
                    player.x + player.width - hitTolerance > obs.x &&
                    player.y + hitTolerance < obs.y + obs.height &&
                    player.y + player.height - hitTolerance > obs.y) {
                    gameOver();
                }
                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    i--;
                }
            }

            for (let i = 0; i < coins.length; i++) {
                let coin = coins[i];
                coin.update();

                if (!coin.collected &&
                    player.x < coin.x + coin.width &&
                    player.x + player.width > coin.x &&
                    player.y < coin.y + coin.height &&
                    player.y + player.height > coin.y) {
                    
                    coin.collected = true;
                    coinsCollected++;
                    document.getElementById('coinVal').innerText = coinsCollected;
                }
                if (coin.x + coin.width < 0) {
                    coins.splice(i, 1);
                    i--;
                }
            }
        }

        function drawGround() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 100);
            ctx.lineTo(canvas.width, canvas.height - 100);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function animate() {
            if (isGameOver || !gameStarted) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGround();
            player.update();
            handleElements();
            
            score += 0.05;
            document.getElementById('scoreVal').innerText = Math.floor(score);
            gameSpeed += 0.0005; 

            animationFrameId = requestAnimationFrame(animate);
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('gameOverScreen').style.display = 'block';
            document.getElementById('finalCoins').innerText = coinsCollected;
            cancelAnimationFrame(animationFrameId);
        }

        window.resetGame = function() {
            isGameOver = false;
            score = 0;
            coinsCollected = 0;
            gameSpeed = 4.5;
            obstacles = [];
            coins = [];
            spawnTimer = 0;
            player.y = 0;
            document.getElementById('scoreVal').innerText = '0';
            document.getElementById('coinVal').innerText = '0';
            document.getElementById('gameOverScreen').style.display = 'none';
            if (gameStarted) {
                animate();
            }
        }

        // دالة بدء اللعبة (تُستدعى بعد إخفاء شاشة التحميل)
        function startGame() {
            gameStarted = true;
            // التأكد من أن اللاعب على الأرض في البداية
            player.y = 0;
            player.dy = 0;
            animate();
        }

        // أحداث التحكم
        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (gameStarted) player.jump();
            }
        });
        
        window.addEventListener('touchstart', function() {
            if (gameStarted) player.jump();
        });

        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // لا نستدعي animate() هنا، سيتم استدعاؤها بعد اكتمال التحميل
    </script>
</body>
</html>
