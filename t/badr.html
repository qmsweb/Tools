<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الهروب وجمع العملات</title>
    <style>
        /* إعدادات الصفحة الأساسية */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        /* واجهة المستخدم بتأثير Glassmorphism */
        .glass-ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 15px 30px;
            display: flex;
            gap: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .stat {
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .stat span {
            color: #C66135; /* لون مميز للأرقام */
        }

        /* شاشة نهاية اللعبة (الخسارة) */
        #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(127, 40, 143, 0.15); /* لون بنفسجي شفاف */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            display: none; /* مخفي افتراضياً */
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            z-index: 20;
        }

        #gameOverScreen h1 {
            margin-top: 0;
            color: #ff4757;
        }

        button {
            background: linear-gradient(45deg, #7F288F, #C66135);
            border: none;
            border-radius: 12px;
            padding: 12px 25px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        canvas {
            display: block;
        }

        /* رسالة توجيهية للمستخدم */
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            opacity: 0.7;
            font-size: 18px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="glass-ui">
        <div class="stat">النقاط: <span id="scoreVal">0</span></div>
        <div class="stat">العملات: <span id="coinVal">0</span></div>
    </div>

    <div id="gameOverScreen">
        <h1>أمسك بك الشرطي!</h1>
        <p class="stat">جمعت <span id="finalCoins">0</span> عملة ذهبية</p>
        <button onclick="resetGame()">العب مرة أخرى</button>
    </div>

    <div id="instructions">اضغط على زر المسافة (Space) أو المس الشاشة للقفز</div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // إعداد حجم الشاشة
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // المتغيرات الأساسية للعبة
        let gameSpeed = 5;
        let gravity = 0.6;
        let score = 0;
        let coinsCollected = 0;
        let isGameOver = false;
        let animationFrameId;

        // تحميل الصور
        const images = {
            player1: new Image(),
            player2: new Image(),
            coin: new Image()
        };
        images.player1.src = 'images/player1.png';
        images.player2.src = 'images/player2.png';
        images.coin.src = 'images/coin.png';

        // كائن الشخصية (اللاعب)
        const player = {
            x: 100,
            y: 0,
            width: 60,
            height: 80,
            dy: 0,
            jumpForce: -14,
            grounded: false,
            runFrame: 1,
            frameTimer: 0,
            
            draw() {
                // التبديل بين صورتي الجري لعمل أنيميشن
                this.frameTimer++;
                if (this.frameTimer % 10 === 0 && this.grounded) {
                    this.runFrame = this.runFrame === 1 ? 2 : 1;
                } else if (!this.grounded) {
                    this.runFrame = 1; // صورة ثابتة أثناء القفز
                }

                const currentImage = this.runFrame === 1 ? images.player1 : images.player2;

                if (currentImage.complete && currentImage.naturalHeight !== 0) {
                    ctx.drawImage(currentImage, this.x, this.y, this.width, this.height);
                } else {
                    // شكل بديل في حال عدم توفر الصورة
                    ctx.fillStyle = '#C66135';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }
            },
            
            update() {
                // تطبيق الجاذبية
                if (!this.grounded) {
                    this.dy += gravity;
                }
                this.y += this.dy;

                // التصادم مع الأرض (أرضية اللعبة ستكون في الثلث السفلي من الشاشة)
                const groundLevel = canvas.height - 100 - this.height;
                if (this.y >= groundLevel) {
                    this.y = groundLevel;
                    this.dy = 0;
                    this.grounded = true;
                } else {
                    this.grounded = false;
                }
                this.draw();
            },
            
            jump() {
                if (this.grounded) {
                    this.dy = this.jumpForce;
                    this.grounded = false;
                }
            }
        };

        // المصفوفات للحواجز (الشرطي/الفخاخ) والعملات
        let obstacles = [];
        let coins = [];

        // فئة الفخاخ/الحواجز
        class Obstacle {
            constructor() {
                this.width = 40;
                this.height = Math.random() * 40 + 40; // ارتفاع عشوائي
                this.x = canvas.width;
                this.y = canvas.height - 100 - this.height; // مستقر على الأرض
            }
            draw() {
                ctx.fillStyle = '#ff4757'; // لون أحمر يعبر عن الخطر/الشرطي
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
            update() {
                this.x -= gameSpeed;
                this.draw();
            }
        }

        // فئة العملات
        class Coin {
            constructor() {
                this.width = 30;
                this.height = 30;
                this.x = canvas.width;
                // ارتفاع عشوائي للعملة لتشجيع القفز
                this.y = canvas.height - 150 - Math.random() * 150; 
                this.collected = false;
            }
            draw() {
                if (images.coin.complete && images.coin.naturalHeight !== 0) {
                    ctx.drawImage(images.coin, this.x, this.y, this.width, this.height);
                } else {
                    // شكل بديل (دائرة ذهبية)
                    ctx.beginPath();
                    ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffd700';
                    ctx.fill();
                    ctx.closePath();
                }
            }
            update() {
                this.x -= gameSpeed;
                if (!this.collected) this.draw();
            }
        }

        // معالجة توليد العناصر العشوائية
        let spawnTimer = 0;
        function handleElements() {
            spawnTimer++;
            
            // توليد فخ أو حاجز كل فترة
            if (spawnTimer % 120 === 0) {
                obstacles.push(new Obstacle());
            }
            
            // توليد عملة كل فترة
            if (spawnTimer % 80 === 0) {
                coins.push(new Coin());
            }

            // تحديث ورسم الحواجز والتصادم
            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.update();
                
                // خوارزمية التصادم المربع (AABB)
                if (player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y) {
                    gameOver();
                }

                // إزالة الحواجز التي خرجت من الشاشة
                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    i--;
                }
            }

            // تحديث ورسم العملات والتصادم
            for (let i = 0; i < coins.length; i++) {
                let coin = coins[i];
                coin.update();

                // تصادم الشخصية مع العملة
                if (!coin.collected &&
                    player.x < coin.x + coin.width &&
                    player.x + player.width > coin.x &&
                    player.y < coin.y + coin.height &&
                    player.y + player.height > coin.y) {
                    
                    coin.collected = true;
                    coinsCollected++;
                    document.getElementById('coinVal').innerText = coinsCollected;
                }

                if (coin.x + coin.width < 0) {
                    coins.splice(i, 1);
                    i--;
                }
            }
        }

        // رسم أرضية اللعبة بشكل جمالي متوافق مع الواجهة
        function drawGround() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)'; // زجاجي خفيف للأرضية
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
            
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 100);
            ctx.lineTo(canvas.width, canvas.height - 100);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // الحلقة التكرارية الرئيسية للعبة
        function animate() {
            if (isGameOver) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawGround();
            player.update();
            handleElements();
            
            // زيادة النقاط وسرعة اللعبة تدريجياً
            score += 0.05;
            document.getElementById('scoreVal').innerText = Math.floor(score);
            gameSpeed += 0.001; 

            animationFrameId = requestAnimationFrame(animate);
        }

        // إنهاء اللعبة
        function gameOver() {
            isGameOver = true;
            document.getElementById('gameOverScreen').style.display = 'block';
            document.getElementById('finalCoins').innerText = coinsCollected;
            cancelAnimationFrame(animationFrameId);
        }

        // إعادة تشغيل اللعبة
        window.resetGame = function() {
            isGameOver = false;
            score = 0;
            coinsCollected = 0;
            gameSpeed = 5;
            obstacles = [];
            coins = [];
            spawnTimer = 0;
            player.y = 0;
            document.getElementById('scoreVal').innerText = '0';
            document.getElementById('coinVal').innerText = '0';
            document.getElementById('gameOverScreen').style.display = 'none';
            animate();
        }

        // التحكم بالقفز
        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                player.jump();
            }
        });
        
        window.addEventListener('touchstart', function() {
            player.jump();
        });

        // ضبط الشاشة عند تغيير الحجم
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // بدء اللعبة
        animate();
    </script>
</body>
</html>
