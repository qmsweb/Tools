<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One TV</title>
  <style>
    :root {
      --highlight-color: #e50914;
      --primary-bg: #141414;
      --secondary-bg: #1f1f1f;
      --card-bg: #2a2a2a;
      --text-primary: #ffffff;
      --text-secondary: #b3b3b3;
      --transition-speed: 0.3s;
      --border-radius: 10px;
      --shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }
    
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    
    body {
      background: linear-gradient(135deg, var(--primary-bg) 0%, #0a0a0a 100%);
      color: var(--text-primary);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-y: auto;
      overflow-x: hidden;
      direction: rtl;
      line-height: 1.6;
      min-height: 100vh;
    }
    
    /* تحسين الهيدر */
    header {
      position: fixed;
      top: 15px;
      right: 30px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    header img {
      height: 55px;
      filter: drop-shadow(0 0 5px rgba(0,0,0,0.7));
      transition: transform 0.3s ease;
    }
    
    .user-profile {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      box-shadow: var(--shadow);
    }
    
    /* تحسين المحتوى الرئيسي */
    #app {
      padding-top: 90px;
      padding-bottom: 50px;
      max-width: 1800px;
      margin: 0 auto;
    }
    
    /* قسم المميز */
    .featured-section {
      margin: 30px 0 60px;
      padding: 0 3vw;
    }
    
    .featured-title {
      font-size: 2.5vw;
      margin-bottom: 20px;
      color: var(--text-primary);
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
      font-weight: 700;
      position: relative;
      padding-bottom: 10px;
    }
    
    .featured-title::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 100px;
      height: 4px;
      background: var(--highlight-color);
      border-radius: 2px;
    }
    
    .featured-carousel {
      display: flex;
      overflow-x: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
      padding-bottom: 20px;
      gap: 1.5vw; /* استخدام gap بدلاً من margin لتجنب مشاكل التمرير */
    }
    
    .featured-carousel::-webkit-scrollbar {
      display: none;
    }
    
    .featured-movie {
      flex: 0 0 auto;
      width: 28vw;
      height: 15.75vw;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      position: relative;
      transition: transform var(--transition-speed), box-shadow var(--transition-speed), border-color var(--transition-speed);
      box-shadow: var(--shadow);
      border: 3px solid transparent; /* زيادة سمك الإطار للتلفاز */
    }
    
    /* التركيز (التحديد بالريموت) */
    .featured-movie.selected, .featured-movie:focus {
      outline: none;
      transform: translateY(-10px) scale(1.03);
      box-shadow: 0 15px 30px rgba(229, 9, 20, 0.4);
      border-color: var(--highlight-color);
    }
    
    .featured-movie img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform var(--transition-speed);
    }
    
    .movie-info {
      position: absolute;
      bottom: 0;
      right: 0;
      left: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
      padding: 20px 15px 15px;
      opacity: 0;
      transition: opacity var(--transition-speed);
    }
    
    .featured-movie.selected .movie-info, .featured-movie:focus .movie-info {
      opacity: 1;
    }
    
    .movie-title {
      font-size: 1.3vw;
      font-weight: 700;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .movie-description {
      font-size: 0.9vw;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    /* الأقسام العادية */
    .section {
      margin: 40px 0;
      position: relative;
    }
    
    .section-title {
      margin: 10px 3vw 20px;
      font-size: 1.8vw;
      color: var(--text-primary);
      text-align: right;
      font-weight: 700;
      position: relative;
      padding-bottom: 8px;
    }
    
    .section.selected .section-title {
      color: var(--highlight-color);
    }
    
    .section-title::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 50px;
      height: 3px;
      background: var(--highlight-color);
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    
    .section.selected .section-title::after {
      width: 100px;
    }
    
    .carousel {
      display: flex;
      overflow-x: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
      padding: 0 3vw 20px;
      gap: 1.5vw;
    }
    
    .carousel::-webkit-scrollbar {
      display: none;
    }
    
    .movie {
      flex: 0 0 auto;
      width: 12vw;
      height: 18vw;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      position: relative;
      transition: transform var(--transition-speed), box-shadow var(--transition-speed), border-color var(--transition-speed);
      box-shadow: var(--shadow);
      border: 3px solid transparent;
    }
    
    /* التركيز (التحديد بالريموت) */
    .movie.selected, .movie:focus {
      outline: none;
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 10px 25px rgba(229, 9, 20, 0.4);
      border-color: var(--highlight-color);
      z-index: 10;
    }
    
    .movie img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* مؤشر التحميل */
    .loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      flex-direction: column;
      gap: 20px;
    }
    
    .spinner {
      width: 70px;
      height: 70px;
      border: 5px solid rgba(229, 9, 20, 0.3);
      border-radius: 50%;
      border-top-color: var(--highlight-color);
      animation: spin 1s linear infinite;
    }
    
    .loader-text {
      font-size: 1.5rem;
      color: var(--text-primary);
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <header>
    <img src="https://raw.githubusercontent.com/qmsweb/Tools/main/images/one.png" alt="Logo">
    <div class="user-profile">م</div>
  </header>
  
  <div id="app"></div>
  
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div class="loader-text">جاري تحميل الأفلام...</div>
  </div>

  <script>
    // 1. إعدادات فايربيس
    const firebaseConfig = {
      apiKey: "AIzaSyDErdK7mjrXUtBYR28U7JIpbFi5RHWM9zM",
      authDomain: "momentschat.firebaseapp.com",
      databaseURL: "https://momentschat.firebaseio.com",
      projectId: "momentschat",
      storageBucket: "momentschat.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "1:866549697398:android:024dd3bf3b81d1adf78857"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. إدارة حالة التنقل (الشبكة)
    let uiMatrix = []; // المصفوفة التي ستحمل كل العناصر القابلة للتحديد [صفوف][أعمدة]
    let navState = { r: 0, c: 0 }; // r = رقم الصف، c = رقم العمود

    // 3. الدالة الرئيسية
    function initApp() {
      setupKeyboardNavigation(); // نقوم بتعريف أزرار الكيبورد مرة واحدة فقط
      fetchData();
    }

    // 4. جلب البيانات
    function fetchData() {
      const loader = document.getElementById('loader');
      loader.style.display = 'flex';

      // مسح الكاش عند التحديث الإجباري
      if (performance.navigation && performance.navigation.type === 1) {
          localStorage.removeItem('cachedVideos');
          localStorage.removeItem('cacheTimestamp');
      }

      const cachedVideos = localStorage.getItem('cachedVideos');
      const cacheTimestamp = localStorage.getItem('cacheTimestamp');
      const oneHour = 60 * 60 * 1000;      
      
      if (cachedVideos && cacheTimestamp && (Date.now() - parseInt(cacheTimestamp)) < oneHour) {
        buildUI(JSON.parse(cachedVideos));
        loader.style.display = 'none';
      } else {
        db.ref("JTV_Cartoon").orderByKey().once("value", (snapshot) => {
          const videos = snapshot.val();
          if (!videos) {
            loader.style.display = 'none';
            return;
          }

          const categorized = {};
          for (let id in videos) {
            const video = videos[id];
            const cat = video.category || 'القنوات';
            if (!categorized[cat]) categorized[cat] = [];
            categorized[cat].push({ ...video, id });
          }

          localStorage.setItem('cachedVideos', JSON.stringify(categorized));
          localStorage.setItem('cacheTimestamp', Date.now().toString());
          
          buildUI(categorized);
          loader.style.display = 'none';
        }).catch((error) => {
          console.error("Error loading videos:", error);
          loader.style.display = 'none';
        });
      }
    }

    // 5. بناء واجهة المستخدم
    function buildUI(categorized) {
      const app = document.getElementById('app');
      app.innerHTML = '';
      uiMatrix = []; // تصفير مصفوفة التحديد

      const categoryNames = Object.keys(categorized);
      if (categoryNames.length === 0) return;

      // بناء القسم المميز (الصف الأول)
      const firstCategory = categoryNames[0];
      createFeaturedSection(app, firstCategory, categorized[firstCategory]);

      // بناء الأقسام العادية (باقي الصفوف)
      categoryNames.forEach((catName, index) => {
        createRegularSection(app, catName, categorized[catName]);
      });

      // استرجاع موقع التحديد الأخير إذا كان موجوداً
      const savedState = localStorage.getItem('tvNavState');
      if (savedState) {
        try { navState = JSON.parse(savedState); } catch(e) {}
      }

      // التأكد من أن التحديد لا يتجاوز العناصر الموجودة فعلياً
      if (navState.r >= uiMatrix.length) navState.r = 0;
      if (uiMatrix.length > 0 && navState.c >= uiMatrix[navState.r].length) navState.c = 0;

      // تفعيل التحديد المرئي
      if (uiMatrix.length > 0) {
        updateFocus();
      }
    }

    // 6. إنشاء مكونات الواجهة
    function createFeaturedSection(container, categoryName, videos) {
      const section = document.createElement('div');
      section.className = 'featured-section';
      
      const title = document.createElement('div');
      title.className = 'featured-title';
      title.textContent = categoryName;
      
      const carousel = document.createElement('div');
      carousel.className = 'featured-carousel';
      
      const rowElements = []; // مصفوفة لحفظ عناصر هذا الصف

      videos.forEach((video) => {
        const movie = document.createElement('div');
        movie.className = 'featured-movie';
        movie.tabIndex = 0;
        
        movie.innerHTML = `
          <img src="${video.cover_URL || 'https://via.placeholder.com/400x225?text=No+Image'}" alt="${video.title || ''}">
          <div class="movie-info">
            <div class="movie-title">${video.title || 'بدون عنوان'}</div>
            <div class="movie-description">${video.description || 'لا يوجد وصف متوفر'}</div>
          </div>
        `;
        
        movie.onclick = () => handleMovieClick(video.id);
        
        carousel.appendChild(movie);
        rowElements.push(movie);
      });
      
      section.appendChild(title);
      section.appendChild(carousel);
      container.appendChild(section);
      
      if (rowElements.length > 0) uiMatrix.push(rowElements); // إضافة الصف للمصفوفة
    }

    function createRegularSection(container, categoryName, videos) {
      const section = document.createElement('div');
      section.className = 'section';
      
      const title = document.createElement('div');
      title.className = 'section-title';
      title.textContent = categoryName;
      
      const carousel = document.createElement('div');
      carousel.className = 'carousel';
      
      const rowElements = []; // مصفوفة لحفظ عناصر هذا الصف

      videos.forEach((video) => {
        const movie = document.createElement('div');
        movie.className = 'movie';
        movie.tabIndex = 0;
        
        movie.innerHTML = `<img src="${video.cover_URL || 'https://via.placeholder.com/300x450?text=No+Image'}" alt="${video.title || ''}">`;
        
        movie.onclick = () => handleMovieClick(video.id);
        
        carousel.appendChild(movie);
        rowElements.push(movie);
      });
      
      section.appendChild(title);
      section.appendChild(carousel);
      container.appendChild(section);
      
      if (rowElements.length > 0) uiMatrix.push(rowElements); // إضافة الصف للمصفوفة
    }

    // 7. إدارة النقر / الدخول للفيلم
    function handleMovieClick(videoId) {
      localStorage.setItem('tvNavState', JSON.stringify(navState));
      window.location.href = `series.html?id=${videoId}`;
    }

    // 8. نظام التنقل بالريموت (السر في سلاسة التلفاز)
    function setupKeyboardNavigation() {
      document.addEventListener('keydown', (e) => {
        const key = e.key;
        if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(key)) return;
        
        e.preventDefault(); // يمنع التلفاز من التمرير العشوائي

        if (uiMatrix.length === 0) return;

        let { r, c } = navState;

        if (key === 'ArrowUp') {
          if (r > 0) r--;
        } else if (key === 'ArrowDown') {
          if (r < uiMatrix.length - 1) r++;
        } else if (key === 'ArrowLeft') {
          // بما أن الاتجاه RTL (عربي)، اليسار يعني الذهاب للعنصر التالي (+)
          if (c < uiMatrix[r].length - 1) c++;
        } else if (key === 'ArrowRight') {
          // اليمين يعني الذهاب للعنصر السابق (-)
          if (c > 0) c--;
        } else if (key === 'Enter') {
          const activeEl = uiMatrix[r][c];
          if (activeEl) activeEl.click();
          return;
        }

        // إذا انتقلنا لصف جديد وكان أقصر من الصف السابق، اضبط العمود لآخر عنصر
        if (c >= uiMatrix[r].length) {
          c = uiMatrix[r].length - 1;
        }

        // تحديث الحالة
        if (navState.r !== r || navState.c !== c) {
          navState = { r, c };
          updateFocus();
        }
      });
    }

    // 9. تحديث التحديد المرئي وتحريك الشاشة
    function updateFocus() {
      // إزالة التحديد من الجميع
      document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
      
      const activeEl = uiMatrix[navState.r][navState.c];
      
      if (activeEl) {
        activeEl.classList.add('selected');
        activeEl.focus(); // هام جداً لدعم بعض أجهزة التلفاز
        
        // التمرير السلس وجعل العنصر في منتصف الشاشة
        activeEl.scrollIntoView({ 
          behavior: 'smooth', 
          block: 'center',    /* يجعل السطر في منتصف الشاشة عمودياً */
          inline: 'center'    /* يجعل الفيلم في منتصف الشاشة أفقياً */
        });

        // إضاءة عنوان القسم النشط
        const parentSection = activeEl.closest('.section') || activeEl.closest('.featured-section');
        if (parentSection) parentSection.classList.add('selected');
      }
    }

    // تشغيل التطبيق عند تحميل الصفحة
    window.addEventListener("load", initApp);
  </script>
</body>
</html>
