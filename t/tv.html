<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix TV Clone</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --netflix-red: #E50914;
      --bg-color: #141414;
      --text-main: #FFFFFF;
      --text-muted: #808080;
      --sidebar-width: 90px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden; /* نمنع التمرير الافتراضي لأننا نتحكم به بالريموت */
      direction: rtl;
    }

    /* 1. القائمة الجانبية (Sidebar) */
    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--sidebar-width);
      height: 100vh;
      background: linear-gradient(to left, rgba(0,0,0,0.85) 0%, transparent 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px; /* زيادة المسافة بين الأيقونات */
      z-index: 1000;
      transition: background var(--transition);
    }

    .nav-item {
      width: 60px; /* تكبير الحاوية */
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px; /* تكبير الأيقونة */
      color: var(--text-muted);
      border-radius: 50%;
      transition: all var(--transition);
      position: relative;
    }

    /* تأثير التركيز (Focus) للقائمة الجانبية */
    .nav-item.selected {
      color: var(--text-main);
      transform: scale(1.4); /* تكبير ملحوظ عند الوقوف */
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.4); /* توهج خفيف للأيقونة */
    }

    /* 2. المحتوى الرئيسي والـ Hero */
    .main-wrapper {
      margin-right: var(--sidebar-width);
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    .main-wrapper::-webkit-scrollbar { display: none; }

    .hero-section {
      position: relative;
      height: 70vh;
      width: 100%;
      background-size: cover;
      background-position: center top;
      transition: background-image 0.5s ease;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--bg-color) 0%, transparent 40%),
                  linear-gradient(to left, var(--bg-color) 0%, transparent 50%);
    }

    .hero-content {
      position: absolute;
      top: 30%;
      right: 5%;
      width: 45%;
      z-index: 10;
    }

    .hero-title {
      font-size: 4vw;
      font-weight: 900;
      margin-bottom: 15px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
    }

    .hero-meta {
      display: flex;
      gap: 15px;
      align-items: center;
      font-size: 1.1vw;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .match-score { color: #46d369; }
    .age-rating { border: 1px solid var(--text-muted); padding: 0 5px; color: var(--text-muted); }

    .hero-desc {
      font-size: 1.2vw;
      color: #e5e5e5;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.8);
    }

    /* 3. صفوف الأفلام (Rows) */
    .rows-container {
      position: relative;
      z-index: 20;
      margin-top: -15vh;
      padding-bottom: 50px;
    }

    .row-section {
      margin-bottom: 3vw;
    }

    .row-title {
      font-size: 1.4vw;
      font-weight: bold;
      margin: 0 5% 10px;
      color: #e5e5e5;
    }

    .carousel {
      display: flex;
      gap: 10px;
      padding: 0 5%;
      overflow-x: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    .carousel::-webkit-scrollbar { display: none; }

    .movie-card {
      flex: 0 0 auto;
      width: 18vw;
      height: 10vw;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      transition: transform var(--transition), border var(--transition), box-shadow var(--transition);
      border: 3px solid transparent;
      background-color: #222;
    }

    .movie-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .movie-card .reminder-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--text-main);
      color: black;
      text-align: center;
      font-size: 0.8vw;
      font-weight: bold;
      padding: 5px 0;
      transform: translateY(100%);
      transition: transform var(--transition);
    }

    .movie-card.selected {
      transform: scale(1.1) translateY(-10px);
      border-color: var(--text-main);
      box-shadow: 0 10px 20px rgba(0,0,0,0.8);
      z-index: 10;
    }
    
    .movie-card.selected .reminder-bar {
      transform: translateY(0);
    }

    /* اللودر */
    .loader {
      position: fixed;
      inset: 0;
      background: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: var(--netflix-red);
      font-size: 2vw;
      font-weight: bold;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="sidebar" id="sidebar">
    <div class="nav-item" id="nav-search"><i class="fas fa-search"></i></div>
    <div class="nav-item" id="nav-home"><i class="fas fa-home"></i></div>
    <div class="nav-item" id="nav-tv"><i class="fas fa-tv"></i></div>
    <div class="nav-item" id="nav-movies"><i class="fas fa-film"></i></div>
    <div class="nav-item" id="nav-list"><i class="fas fa-plus"></i></div>
  </div>

  <div class="main-wrapper" id="main-scroll-area">
    <div class="hero-section" id="hero-section" style="background-image: url('https://via.placeholder.com/1920x1080/141414/141414');">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1 class="hero-title" id="hero-title">جاري التحميل...</h1>
        <div class="hero-meta">
          <span class="match-score">97% مطابقة</span>
          <span>2023</span>
          <span class="age-rating">+16</span>
          <span>HD</span>
        </div>
        <p class="hero-desc" id="hero-desc">يرجى الانتظار بينما نقوم بجلب أحدث العروض والأفلام المخصصة لك.</p>
      </div>
    </div>

    <div class="rows-container" id="app"></div>
  </div>

  <div class="loader" id="loader">NETFLIX...</div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDErdK7mjrXUtBYR28U7JIpbFi5RHWM9zM",
      authDomain: "momentschat.firebaseapp.com",
      databaseURL: "https://momentschat.firebaseio.com",
      projectId: "momentschat",
      storageBucket: "momentschat.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "1:866549697398:android:024dd3bf3b81d1adf78857"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let uiMatrix = []; 
    let sidebarElements = [];
    
    let state = {
      zone: 'content',
      r: 0,
      c: 0,
      sIndex: 1 
    };

    function initApp() {
      sidebarElements = Array.from(document.querySelectorAll('.nav-item'));
      setupKeyboardNavigation();
      fetchData();
    }

    function fetchData() {
      const loader = document.getElementById('loader');
      loader.style.display = 'flex';

      db.ref("JTV_Cartoon").orderByKey().once("value", (snapshot) => {
        const videos = snapshot.val();
        if (!videos) {
          loader.style.display = 'none';
          return;
        }

        const categorized = {};
        for (let id in videos) {
          const video = videos[id];
          const cat = video.category || 'أضيف حديثاً';
          if (!categorized[cat]) categorized[cat] = [];
          categorized[cat].push({ ...video, id });
        }

        buildUI(categorized);
        loader.style.display = 'none';
      }).catch((error) => {
        console.error("Error loading videos:", error);
        loader.style.display = 'none';
      });
    }

    function buildUI(categorized) {
      const app = document.getElementById('app');
      app.innerHTML = '';
      uiMatrix = [];

      Object.keys(categorized).forEach((catName) => {
        createRow(app, catName, categorized[catName]);
      });

      const savedState = localStorage.getItem('netflixNavState');
      if (savedState) {
        try { state = JSON.parse(savedState); } catch(e) {}
      }

      if (state.r >= uiMatrix.length) state.r = 0;
      if (uiMatrix.length > 0 && state.c >= uiMatrix[state.r].length) state.c = 0;

      updateFocus();
    }

    function createRow(container, categoryName, videos) {
      const section = document.createElement('div');
      section.className = 'row-section';
      
      const title = document.createElement('div');
      title.className = 'row-title';
      title.textContent = categoryName;
      
      const carousel = document.createElement('div');
      carousel.className = 'carousel';
      
      const rowElements = [];

      videos.forEach((video) => {
        const movie = document.createElement('div');
        movie.className = 'movie-card';
        
        movie.dataset.videoInfo = JSON.stringify(video);
        
        movie.innerHTML = `
          <img src="${video.cover_URL || 'https://via.placeholder.com/400x225?text=No+Image'}" alt="${video.title || ''}">
          <div class="reminder-bar">اضغط للمشاهدة</div>
        `;
        
        movie.onclick = () => handleMovieClick(video.id);
        
        carousel.appendChild(movie);
        rowElements.push(movie);
      });
      
      section.appendChild(title);
      section.appendChild(carousel);
      container.appendChild(section);
      
      if (rowElements.length > 0) uiMatrix.push(rowElements);
    }

    function handleMovieClick(videoId) {
      localStorage.setItem('netflixNavState', JSON.stringify(state));
      window.location.href = `series.html?id=${videoId}`;
    }

    function updateHeroSection(videoData) {
      const heroSec = document.getElementById('hero-section');
      const heroTitle = document.getElementById('hero-title');
      const heroDesc = document.getElementById('hero-desc');

      if (videoData.cover_URL) {
        heroSec.style.backgroundImage = `url('${videoData.cover_URL}')`;
      }
      heroTitle.textContent = videoData.title || 'بدون عنوان';
      heroDesc.textContent = videoData.description || 'لا يوجد وصف متوفر لهذا العرض. اضغط للمزيد من التفاصيل.';
    }

    function setupKeyboardNavigation() {
      document.addEventListener('keydown', (e) => {
        const key = e.key;
        if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(key)) return;
        e.preventDefault();

        if (state.zone === 'content') {
            handleContentNav(key);
        } else if (state.zone === 'sidebar') {
            handleSidebarNav(key);
        }

        updateFocus();
      });
    }

    function handleContentNav(key) {
      let { r, c } = state;

      if (key === 'ArrowUp') {
        if (r > 0) r--;
      } else if (key === 'ArrowDown') {
        if (r < uiMatrix.length - 1) r++;
      } else if (key === 'ArrowLeft') {
        if (c < uiMatrix[r].length - 1) c++;
      } else if (key === 'ArrowRight') {
        if (c > 0) {
          c--;
        } else {
          state.zone = 'sidebar';
          return;
        }
      } else if (key === 'Enter') {
        const activeEl = uiMatrix[r][c];
        if (activeEl) activeEl.click();
        return;
      }

      if (c >= uiMatrix[r].length) c = uiMatrix[r].length - 1;
      
      state.r = r;
      state.c = c;
    }

    function handleSidebarNav(key) {
      let idx = state.sIndex;

      if (key === 'ArrowUp') {
        if (idx > 0) idx--;
      } else if (key === 'ArrowDown') {
        if (idx < sidebarElements.length - 1) idx++;
      } else if (key === 'ArrowLeft') {
        state.zone = 'content';
        state.c = 0;
        return;
      } else if (key === 'Enter') {
        console.log("تم ضغط القائمة الجانبية: " + idx);
      }
      
      state.sIndex = idx;
    }

    function updateFocus() {
      document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));

      if (state.zone === 'content') {
        const activeEl = uiMatrix[state.r][state.c];
        if (activeEl) {
          activeEl.classList.add('selected');
          
          try {
            const videoData = JSON.parse(activeEl.dataset.videoInfo);
            updateHeroSection(videoData);
          } catch(e) {}

          activeEl.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
        }
      } else if (state.zone === 'sidebar') {
        const activeSide = sidebarElements[state.sIndex];
        if (activeSide) {
          activeSide.classList.add('selected');
        }
        document.getElementById('main-scroll-area').scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    window.addEventListener("load", initApp);
  </script>
</body>
</html>
