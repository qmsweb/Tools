<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية - لعبة الهروب وجمع الفلافل</title>
    <style>
        /* إعدادات الصفحة الأساسية - مطابقة للعبة */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }

        /* حاوية القائمة الرئيسية (تصميم زجاجي مشابه لشاشة الخسارة) */
        .home-container {
            background: rgba(127, 40, 143, 0.15); /* لون بنفسجي شفاف */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
            z-index: 10;
            animation: fadeIn 1s ease-in-out;
        }

        /* إعدادات الشعار */
        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        /* نصوص الواجهة */
        h1 {
            color: #ffd700; /* لون ذهبي */
            margin-top: 0;
            font-size: 32px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 35px;
            color: #e0e0e0;
        }

        /* زر اللعب */
        button {
            background: linear-gradient(45deg, #7F288F, #C66135);
            border: none;
            border-radius: 15px;
            padding: 15px 45px;
            color: white;
            font-size: 22px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(198, 97, 53, 0.4);
        }

        /* تأثير الدخول الحركي للصفحة */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ديكورات في الخلفية لتجميل الصفحة الرئيسية */
        .decoration {
            position: absolute;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
        }
        .dec-1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .dec-2 { width: 200px; height: 200px; bottom: -50px; right: -50px; }

        /* تحسينات التوافق مع الشاشات المختلفة (بدون تعديل التصميم الأساسي) */
        @media screen and (max-width: 600px) {
            .home-container {
                padding: 35px 25px;
            }
            h1 {
                font-size: 26px;
            }
            p {
                font-size: 16px;
                margin-bottom: 25px;
            }
            button {
                padding: 14px 35px;
                font-size: 20px;
            }
            .logo {
                max-width: 160px;
            }
            .dec-1 { width: 200px; height: 200px; top: -70px; left: -70px; }
            .dec-2 { width: 140px; height: 140px; bottom: -35px; right: -35px; }
        }

        @media screen and (max-width: 400px) {
            .home-container {
                padding: 25px 15px;
                border-radius: 20px;
            }
            h1 {
                font-size: 22px;
            }
            p {
                font-size: 15px;
            }
            button {
                padding: 12px 30px;
                font-size: 18px;
                border-radius: 12px;
            }
            .logo {
                max-width: 130px;
                margin-bottom: 15px;
            }
        }

        /* للتكيف مع الشاشات ذات الارتفاع الصغير جداً (مثل وضع الأفقي في الهواتف) */
        @media screen and (max-height: 500px) and (orientation: landscape) {
            .home-container {
                padding: 15px 20px;
            }
            .logo {
                max-width: 100px;
                margin-bottom: 10px;
            }
            h1 {
                font-size: 20px;
                margin-bottom: 5px;
            }
            p {
                font-size: 14px;
                margin-bottom: 15px;
                line-height: 1.4;
            }
            button {
                padding: 10px 25px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="decoration dec-1"></div>
    <div class="decoration dec-2"></div>

    <div class="home-container">
        <img src="/images/logo-badr.png" alt="شعار لعبة السيد بدر" class="logo">
        
        <h1>لعبة الهروب وجمع الفلافل</h1>
        <p>ساعد السيد بدر في الهروب من أهل شعنزي وجمع أكبر قدر ممكن من الفلافل الذهبية. هل أنت مستعد للتحدي؟</p>
        
        <button onclick="window.location.href='/t/badr'">ابدأ اللعب الآن</button>
    </div>

</body>
</html>
