<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد YAML للاختبارات</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap');
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            direction: rtl;
        }
    </style>
    <!-- js-yaml CDN for parsing/dumping YAML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-5xl space-y-6">
        <h1 class="text-3xl font-bold text-center text-gray-800">مولد YAML للاختبارات</h1>
        
        <!-- معلومات الاختبار -->
        <div class="space-y-4 bg-gray-50 p-6 rounded-xl shadow-inner">
            <label for="quiz-title-input" class="block text-lg font-medium text-gray-700">عنوان الاختبار:</label>
            <input type="text" id="quiz-title-input" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="مثال: اختبار تاريخي">

            <div class="flex flex-col md:flex-row space-y-4 md:space-y-0 md:space-x-4 md:space-x-reverse mt-4">
                <div class="w-full md:w-1/2">
                    <label for="subject-name-input" class="block text-lg font-medium text-gray-700">اسم المقرر:</label>
                    <input type="text" id="subject-name-input" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="مثال: مبادئ البرمجة">
                </div>
                <div class="w-full md:w-1/2">
                    <label for="subject-code-input" class="block text-lg font-medium text-gray-700">رمز المقرر:</label>
                    <input type="text" id="subject-code-input" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="مثال: CS101">
                </div>
            </div>
        </div>

        <!-- قائمة الأسئلة -->
        <div id="questions-container" class="space-y-6">
            <!-- سيتم إضافة الأسئلة هنا بواسطة JavaScript -->
        </div>

        <!-- زر إضافة سؤال -->
        <button id="add-question-btn" class="w-full bg-green-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:bg-green-700 transition-colors duration-200">
            إضافة سؤال جديد
        </button>

        <!-- زر توليد YAML -->
        <button id="generate-yaml-btn" class="w-full bg-blue-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:bg-blue-700 transition-colors duration-200">
            توليد كود YAML
        </button>

        <!-- منطقة عرض YAML -->
        <div id="yaml-output-section" class="space-y-4 hidden">
            <h2 class="text-xl font-bold text-gray-800">كود YAML الناتج:</h2>
            <div class="relative">
                <textarea id="yaml-output" readonly rows="15" class="w-full p-4 border border-gray-300 rounded-lg bg-gray-50 font-mono text-sm"></textarea>
                <button id="copy-yaml-btn" class="absolute top-3 right-3 bg-gray-200 text-gray-800 py-1 px-3 rounded-lg text-sm hover:bg-gray-300 transition-colors duration-200">
                    نسخ
                </button>
            </div>
        </div>

        <!-- مربع الرسائل المخصص -->
        <div id="message-box" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white p-6 rounded-xl shadow-2xl border border-gray-200 max-w-sm w-full text-center hidden">
            <p id="message-text" class="text-gray-800 font-medium"></p>
            <button id="message-close-btn" class="mt-4 bg-gray-200 text-gray-800 py-2 px-4 rounded-lg hover:bg-gray-300 transition-colors duration-200">
                إغلاق
            </button>
        </div>

    </div>

    <script>
        // دالة لعرض رسائل مخصصة بدلاً من alert
        function showMessage(text) {
            const messageBox = document.getElementById('message-box');
            const messageText = document.getElementById('message-text');
            messageText.textContent = text;
            messageBox.classList.remove('hidden');
        }

        document.getElementById('message-close-btn').addEventListener('click', () => {
            document.getElementById('message-box').classList.add('hidden');
        });
        
        // متغير لعداد الأسئلة
        let questionCounter = 0;

        // دالة لتحديث أرقام الأسئلة بعد كل عملية حذف أو نقل
        function updateQuestionNumbers() {
            const questions = document.querySelectorAll('.question-block');
            questions.forEach((qBlock, index) => {
                const questionNumber = index + 1;
                qBlock.querySelector('h3').textContent = `سؤال جديد #${questionNumber}`;
            });
        }

        // عند النقر على زر "إضافة سؤال جديد"
        document.getElementById('add-question-btn').addEventListener('click', () => {
            questionCounter++;
            const questionsContainer = document.getElementById('questions-container');

            const questionBlock = document.createElement('div');
            questionBlock.id = `question-${questionCounter}`;
            questionBlock.className = 'question-block bg-gray-50 p-6 rounded-xl shadow-inner border border-gray-200 space-y-4';
            questionBlock.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-gray-800">سؤال جديد #${questionCounter}</h3>
                    <div class="flex space-x-2 space-x-reverse">
                        <button class="move-up-btn text-gray-500 hover:text-gray-700 transition-colors" title="نقل لأعلى">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
                            </svg>
                        </button>
                        <button class="move-down-btn text-gray-500 hover:text-gray-700 transition-colors" title="نقل لأسفل">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <button class="remove-question-btn text-red-500 hover:text-red-700 transition-colors" title="حذف السؤال">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>
                
                <label for="q-${questionCounter}-text" class="block text-sm font-medium text-gray-700">نص السؤال:</label>
                <input type="text" id="q-${questionCounter}-text" class="question-text w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="مثال: ما هو تاريخ تأسيس الدولة السعودية الثالثة؟">
                
                <div class="flex space-x-4 space-x-reverse">
                    <div class="w-1/2">
                        <label for="q-${questionCounter}-type" class="block text-sm font-medium text-gray-700">نوع السؤال:</label>
                        <select id="q-${questionCounter}-type" class="question-type w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="mcq">اختيار من متعدد (MCQ)</option>
                            <option value="essay">مقالي</option>
                        </select>
                    </div>
                    <div class="w-1/2">
                        <label for="q-${questionCounter}-points" class="block text-sm font-medium text-gray-700">النقاط:</label>
                        <input type="number" id="q-${questionCounter}-points" class="question-points w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" value="1" min="1">
                    </div>
                </div>

                <div id="q-${questionCounter}-options-container" class="options-container space-y-4 mt-4">
                    <!-- خيارات السؤال سيتم إضافتها هنا -->
                </div>
            `;
            questionsContainer.appendChild(questionBlock);
            updateQuestionNumbers();
            setupEventListeners(questionBlock);
        });

        // دالة لإعداد مستمعي الأحداث لكل سؤال
        function setupEventListeners(questionBlock) {
            const questionId = questionBlock.id.split('-')[1];

            // مستمع للتحكم في عرض خيارات الإجابة
            const questionTypeSelect = questionBlock.querySelector('.question-type');
            const optionsContainer = questionBlock.querySelector('.options-container');

            questionTypeSelect.addEventListener('change', (e) => {
                if (e.target.value === 'mcq') {
                    optionsContainer.innerHTML = `
                        <div id="q-${questionId}-mcq-choices" class="space-y-2">
                            <label class="block text-sm font-medium text-gray-700">خيارات الإجابة:</label>
                            <div class="flex items-center gap-2 choice-group">
                                <input type="radio" id="q-${questionId}-answer-0" name="q-${questionId}-answer" class="text-blue-600 focus:ring-blue-500 h-4 w-4" value="0" checked>
                                <label for="q-${questionId}-answer-0" class="sr-only">الإجابة الصحيحة</label>
                                <input type="text" id="q-${questionId}-choice-0" class="choice-text w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="خيار 1">
                                <button class="remove-choice-btn text-red-500 hover:text-red-700 transition-colors hidden" type="button" title="حذف الخيار">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <button class="add-choice-btn mt-2 bg-gray-200 text-gray-800 py-2 px-4 rounded-lg text-sm hover:bg-gray-300 transition-colors duration-200" type="button">
                            إضافة خيار إجابة
                        </button>
                    `;
                    // إعادة إعداد مستمعي الأحداث للعناصر الجديدة
                    setupChoiceEventListeners(questionBlock);
                } else if (e.target.value === 'essay') {
                    optionsContainer.innerHTML = `
                        <label for="q-${questionId}-answer-essay" class="block text-sm font-medium text-gray-700">الإجابة النموذجية:</label>
                        <textarea id="q-${questionId}-answer-essay" class="answer-essay w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" rows="4" placeholder="اكتب الإجابة النموذجية هنا..."></textarea>
                    `;
                }
            });

            // إعداد مستمعي الأحداث لخيارات الاختيار من متعدد
            const initialType = questionTypeSelect.value;
            if (initialType === 'mcq') {
                optionsContainer.innerHTML = `
                    <div id="q-${questionId}-mcq-choices" class="space-y-2">
                        <label class="block text-sm font-medium text-gray-700">خيارات الإجابة:</label>
                        <div class="flex items-center gap-2 choice-group">
                            <input type="radio" id="q-${questionId}-answer-0" name="q-${questionId}-answer" class="text-blue-600 focus:ring-blue-500 h-4 w-4" value="0" checked>
                            <label for="q-${questionId}-answer-0" class="sr-only">الإجابة الصحيحة</label>
                            <input type="text" id="q-${questionId}-choice-0" class="choice-text w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="خيار 1">
                            <button class="remove-choice-btn text-red-500 hover:text-red-700 transition-colors hidden" type="button" title="حذف الخيار">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button class="add-choice-btn mt-2 bg-gray-200 text-gray-800 py-2 px-4 rounded-lg text-sm hover:bg-gray-300 transition-colors duration-200" type="button">
                        إضافة خيار إجابة
                    </button>
                `;
                setupChoiceEventListeners(questionBlock);
            } else if (initialType === 'essay') {
                 optionsContainer.innerHTML = `
                    <label for="q-${questionId}-answer-essay" class="block text-sm font-medium text-gray-700">الإجابة النموذجية:</label>
                    <textarea id="q-${questionId}-answer-essay" class="answer-essay w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" rows="4" placeholder="اكتب الإجابة النموذجية هنا..."></textarea>
                `;
            }

        }

        function setupChoiceEventListeners(questionBlock) {
            const optionsContainer = questionBlock.querySelector('.options-container');
            const choicesDiv = optionsContainer.querySelector('[id$="-mcq-choices"]');

            // مستمع لزر إضافة خيار
            const addChoiceBtn = optionsContainer.querySelector('.add-choice-btn');
            if (addChoiceBtn) {
                addChoiceBtn.addEventListener('click', () => {
                    const choiceGroups = choicesDiv.querySelectorAll('.choice-group');
                    const choiceCounter = choiceGroups.length;

                    const newChoiceDiv = document.createElement('div');
                    newChoiceDiv.className = 'flex items-center gap-2 choice-group';
                    newChoiceDiv.innerHTML = `
                        <input type="radio" id="q-${questionBlock.id.split('-')[1]}-answer-${choiceCounter}" name="q-${questionBlock.id.split('-')[1]}-answer" class="text-blue-600 focus:ring-blue-500 h-4 w-4" value="${choiceCounter}">
                        <label for="q-${questionBlock.id.split('-')[1]}-answer-${choiceCounter}" class="sr-only">الإجابة الصحيحة</label>
                        <input type="text" id="q-${questionBlock.id.split('-')[1]}-choice-${choiceCounter}" class="choice-text w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="خيار ${choiceCounter + 1}">
                        <button class="remove-choice-btn text-red-500 hover:text-red-700 transition-colors" type="button" title="حذف الخيار">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    `;
                    choicesDiv.appendChild(newChoiceDiv);
                });
            }

            // مستمع لحذف الخيار
            choicesDiv.addEventListener('click', (e) => {
                const removeBtn = e.target.closest('.remove-choice-btn');
                if (removeBtn) {
                    const choiceGroup = removeBtn.closest('.choice-group');
                    if (choicesDiv.querySelectorAll('.choice-group').length > 1) {
                        choiceGroup.remove();
                        // إعادة تسمية قيم الراديو لتجنب الأخطاء
                        choicesDiv.querySelectorAll('.choice-group').forEach((group, index) => {
                            const radioBtn = group.querySelector('input[type="radio"]');
                            radioBtn.id = `q-${questionBlock.id.split('-')[1]}-answer-${index}`;
                            radioBtn.value = index;
                            group.querySelector('label').htmlFor = `q-${questionBlock.id.split('-')[1]}-answer-${index}`;
                        });
                    } else {
                        showMessage('يجب أن يحتوي السؤال على خيار واحد على الأقل.');
                    }
                }
            });
        }


        // مستمع أحداث رئيسي على حاوية الأسئلة للتعامل مع الأزرار الديناميكية
        document.getElementById('questions-container').addEventListener('click', (e) => {
            const questionBlock = e.target.closest('.question-block');
            if (!questionBlock) return;

            if (e.target.closest('.remove-question-btn')) {
                questionBlock.remove();
                updateQuestionNumbers();
            } else if (e.target.closest('.move-up-btn')) {
                const prevQuestion = questionBlock.previousElementSibling;
                if (prevQuestion) {
                    questionsContainer.insertBefore(questionBlock, prevQuestion);
                    updateQuestionNumbers();
                }
            } else if (e.target.closest('.move-down-btn')) {
                const nextQuestion = questionBlock.nextElementSibling;
                if (nextQuestion) {
                    questionsContainer.insertBefore(nextQuestion, questionBlock);
                    updateQuestionNumbers();
                }
            }
        });

        // عند النقر على زر "توليد كود YAML"
        document.getElementById('generate-yaml-btn').addEventListener('click', () => {
            const quizTitle = document.getElementById('quiz-title-input').value.trim();
            const subjectName = document.getElementById('subject-name-input').value.trim();
            const subjectCode = document.getElementById('subject-code-input').value.trim();
            const questions = [];
            const questionsContainer = document.getElementById('questions-container');

            if (!quizTitle) {
                showMessage('يرجى إدخال عنوان للاختبار.');
                return;
            }
            if (!subjectName) {
                showMessage('يرجى إدخال اسم المقرر.');
                return;
            }
            if (!subjectCode) {
                showMessage('يرجى إدخال رمز المقرر.');
                return;
            }
            
            let hasError = false;

            questionsContainer.querySelectorAll('.question-block').forEach(qBlock => {
                const questionText = qBlock.querySelector('.question-text').value.trim();
                const questionType = qBlock.querySelector('.question-type').value;
                const questionPoints = parseInt(qBlock.querySelector('.question-points').value, 10);
                
                if (!questionText || isNaN(questionPoints)) {
                    showMessage('يرجى ملء جميع حقول الأسئلة بشكل صحيح.');
                    hasError = true;
                    return;
                }

                const newQuestion = {
                    question: questionText,
                    type: questionType,
                    points: questionPoints
                };

                if (questionType === 'mcq') {
                    const choicesInputs = qBlock.querySelectorAll('.choice-text');
                    const choices = [];
                    choicesInputs.forEach(choiceInput => {
                        const choiceText = choiceInput.value.trim();
                        if (choiceText) {
                            choices.push(choiceText);
                        }
                    });
                    
                    const checkedRadio = qBlock.querySelector('input[type="radio"]:checked');
                    if (choices.length === 0 || !checkedRadio) {
                        showMessage('يرجى إضافة خيارات الإجابة وتحديد الإجابة الصحيحة لأسئلة الاختيار من متعدد.');
                        hasError = true;
                        return;
                    }
                    
                    const answerIndex = parseInt(checkedRadio.value, 10);
                    newQuestion.choices = choices;
                    newQuestion.answer = choices[answerIndex];

                } else if (questionType === 'essay') {
                    const answer = qBlock.querySelector('.answer-essay').value.trim();
                    if (!answer) {
                        showMessage('يرجى كتابة الإجابة النموذجية للسؤال المقالي.');
                        hasError = true;
                        return;
                    }
                    newQuestion.answer = answer;
                }
                questions.push(newQuestion);
            });

            if (hasError) {
                return;
            }

            if (questions.length === 0) {
                showMessage('يرجى إضافة سؤال واحد على الأقل.');
                return;
            }

            const quizObject = [
                {
                    title: quizTitle,
                    'subject-name': subjectName,
                    'subject-code': subjectCode,
                    questions: questions
                }
            ];

            // استخدام js-yaml لتحويل كائن JavaScript إلى YAML
            const yamlString = jsyaml.dump(quizObject, {
                indent: 2,
                lineWidth: -1,
                noRefs: true
            });

            document.getElementById('yaml-output').value = yamlString;
            document.getElementById('yaml-output-section').classList.remove('hidden');
        });

        // عند النقر على زر "نسخ"
        document.getElementById('copy-yaml-btn').addEventListener('click', () => {
            const outputTextarea = document.getElementById('yaml-output');
            outputTextarea.select();
            outputTextarea.setSelectionRange(0, 99999); // لتحديد النص على الأجهزة المحمولة
            try {
                // استخدام execCommand لأن navigator.clipboard قد لا يعمل في iframe
                document.execCommand('copy');
                showMessage('تم نسخ الكود بنجاح!');
            } catch (err) {
                showMessage('فشل النسخ. يرجى النسخ يدوياً.');
                console.error('Copy failed', err);
            }
        });

        // إضافة سؤال افتراضي عند تحميل الصفحة
        window.onload = function() {
            document.getElementById('add-question-btn').click();
        }
    </script>
</body>
</html>
