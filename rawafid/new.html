<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد JSON لبيانات المواد</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap');
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            direction: rtl;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-5xl space-y-6">
        <h1 class="text-3xl font-bold text-center text-gray-800">مولد JSON لبيانات المواد</h1>

        <!-- معلومات الصفحة الرئيسية -->
        <div class="space-y-4 bg-gray-50 p-6 rounded-xl shadow-inner">
            <h2 class="text-xl font-bold text-gray-800">معلومات الصفحة الرئيسية</h2>
            <label for="page-name-input" class="block text-lg font-medium text-gray-700">عنوان الصفحة:</label>
            <input type="text" id="page-name-input" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="مثال: ملخصات شاملة">
            
            <label for="page-description-input" class="block text-lg font-medium text-gray-700">وصف الصفحة:</label>
            <textarea id="page-description-input" rows="3" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="مثال: هذه الصفحة مخصصة لعرض ملخصات كافة المقررات"></textarea>
            
            <label for="page-url-input" class="block text-lg font-medium text-gray-700">رابط الصفحة:</label>
            <input type="text" id="page-url-input" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="مثال: https://rawafid.jassim.one/c/EDUC431">
        </div>

        <!-- استيراد كود JSON -->
        <div class="space-y-4 bg-gray-50 p-6 rounded-xl shadow-inner">
            <h2 class="text-xl font-bold text-gray-800">استيراد كود JSON</h2>
            <textarea id="json-input-area" rows="8" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 font-mono text-sm" placeholder="الصق كود JSON هنا ليتم تحويله إلى نموذج قابل للتعديل..."></textarea>
            <button id="load-json-btn" class="w-full bg-orange-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:bg-orange-700 transition-colors duration-200">
                تحويل كود JSON
            </button>
        </div>

        <!-- قائمة العناصر -->
        <div id="items-container" class="space-y-6">
            <!-- سيتم إضافة العناصر هنا بواسطة JavaScript -->
        </div>

        <!-- زر إضافة عنصر -->
        <button id="add-item-btn" class="w-full bg-green-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:bg-green-700 transition-colors duration-200">
            إضافة عنصر جديد
        </button>

        <!-- زر توليد JSON -->
        <button id="generate-json-btn" class="w-full bg-blue-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:bg-blue-700 transition-colors duration-200">
            توليد كود JSON
        </button>

        <!-- منطقة عرض JSON -->
        <div id="json-output-section" class="space-y-4 hidden">
            <h2 class="text-xl font-bold text-gray-800">كود JSON الناتج:</h2>
            <div class="relative">
                <textarea id="json-output" readonly rows="15" class="w-full p-4 border border-gray-300 rounded-lg bg-gray-50 font-mono text-sm"></textarea>
                <button id="copy-json-btn" class="absolute top-3 right-3 bg-gray-200 text-gray-800 py-1 px-3 rounded-lg text-sm hover:bg-gray-300 transition-colors duration-200">
                    نسخ
                </button>
            </div>
        </div>

        <!-- مربع الرسائل المخصص -->
        <div id="message-box" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white p-6 rounded-xl shadow-2xl border border-gray-200 max-w-sm w-full text-center hidden">
            <p id="message-text" class="text-gray-800 font-medium"></p>
            <button id="message-close-btn" class="mt-4 bg-gray-200 text-gray-800 py-2 px-4 rounded-lg hover:bg-gray-300 transition-colors duration-200">
                إغلاق
            </button>
        </div>

    </div>

    <script>
        // دالة لعرض رسائل مخصصة بدلاً من alert
        function showMessage(text) {
            const messageBox = document.getElementById('message-box');
            const messageText = document.getElementById('message-text');
            messageText.textContent = text;
            messageBox.classList.remove('hidden');
        }

        document.getElementById('message-close-btn').addEventListener('click', () => {
            document.getElementById('message-box').classList.add('hidden');
        });

        // متغير لعداد العناصر
        let itemCounter = 0;

        // دالة لتحديث أرقام العناصر
        function updateItemNumbers() {
            const items = document.querySelectorAll('.item-block');
            items.forEach((iBlock, index) => {
                const itemNumber = index + 1;
                iBlock.querySelector('h3').textContent = `عنصر #${itemNumber}`;
            });
        }

        // دالة لمسح جميع العناصر
        function clearAllItems() {
            const itemsContainer = document.getElementById('items-container');
            itemsContainer.innerHTML = '';
            itemCounter = 0;
        }

        // دالة جديدة لإضافة عنصر جديد
        function addItem() {
            itemCounter++;
            const itemsContainer = document.getElementById('items-container');

            const itemBlock = document.createElement('div');
            itemBlock.id = `item-${itemCounter}`;
            itemBlock.className = 'item-block bg-gray-50 p-6 rounded-xl shadow-inner border border-gray-200 space-y-4';
            itemBlock.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-gray-800">عنصر #${itemCounter}</h3>
                    <div class="flex space-x-2 space-x-reverse">
                        <button class="move-up-btn text-gray-500 hover:text-gray-700 transition-colors" title="نقل لأعلى">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
                            </svg>
                        </button>
                        <button class="move-down-btn text-gray-500 hover:text-gray-700 transition-colors" title="نقل لأسفل">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <button class="remove-item-btn text-red-500 hover:text-red-700 transition-colors" title="حذف العنصر">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>

                <label for="i-${itemCounter}-title" class="block text-sm font-medium text-gray-700">عنوان العنصر:</label>
                <input type="text" id="i-${itemCounter}-title" class="item-title w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="مثال: ملخص 1">

                <label for="i-${itemCounter}-description" class="block text-sm font-medium text-gray-700">وصف العنصر:</label>
                <textarea id="i-${itemCounter}-description" rows="2" class="item-description w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="اكتب وصف العنصر هنا..."></textarea>

                <label for="i-${itemCounter}-type" class="block text-sm font-medium text-gray-700">نوع العنصر:</label>
                <select id="i-${itemCounter}-type" class="item-type w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="documents">مستند</option>
                    <option value="videos">فيديو</option>
                    <option value="quizzes">اختبار تفاعلي</option>
                    <option value="resources">ملاحظة</option>
                    <option value="links">رابط</option>
                </select>

                <div id="i-${itemCounter}-type-fields" class="type-fields space-y-4 mt-4">
                    <!-- حقول خاصة بنوع العنصر -->
                </div>
            `;
            itemsContainer.appendChild(itemBlock);
            updateItemNumbers();
            setupEventListeners(itemBlock);
            itemBlock.querySelector('.item-type').dispatchEvent(new Event('change')); // لتوليد الحقول الأولية
            return itemBlock; // إرجاع العنصر الجديد
        }

        // عند النقر على زر "إضافة عنصر جديد"
        document.getElementById('add-item-btn').addEventListener('click', () => {
            addItem();
        });

        // دالة لإعداد مستمعي الأحداث لكل عنصر
        function setupEventListeners(itemBlock) {
            const itemId = itemBlock.id.split('-')[1];

            // مستمع للتحكم في عرض الحقول بناءً على نوع العنصر
            const itemTypeSelect = itemBlock.querySelector('.item-type');
            const typeFieldsContainer = itemBlock.querySelector('.type-fields');

            itemTypeSelect.addEventListener('change', (e) => {
                const type = e.target.value;
                typeFieldsContainer.innerHTML = ''; // مسح الحقول الحالية

                if (type === 'documents') {
                    typeFieldsContainer.innerHTML = `
                        <label for="i-${itemId}-preview-url" class="block text-sm font-medium text-gray-700">رابط المعاينة:</label>
                        <input type="text" id="i-${itemId}-preview-url" class="item-preview-url w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="مثال: 21">
                        <label for="i-${itemId}-download-url" class="block text-sm font-medium text-gray-700">رابط التحميل:</label>
                        <input type="text" id="i-${itemId}-download-url" class="item-download-url w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="مثال: 12">
                    `;
                } else if (type === 'videos') {
                    typeFieldsContainer.innerHTML = `
                        <label for="i-${itemId}-preview-url" class="block text-sm font-medium text-gray-700">رابط الفيديو:</label>
                        <input type="text" id="i-${itemId}-preview-url" class="item-preview-url w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="مثال: 31">
                    `;
                } else if (type === 'quizzes') {
                    typeFieldsContainer.innerHTML = `
                        <label for="i-${itemId}-preview-url" class="block text-sm font-medium text-gray-700">رابط الاختبار:</label>
                        <input type="text" id="i-${itemId}-preview-url" class="item-preview-url w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="مثال: صثص">
                    `;
                } else if (type === 'links') {
                    typeFieldsContainer.innerHTML = `
                        <label for="i-${itemId}-preview-url" class="block text-sm font-medium text-gray-700">رابط الموقع:</label>
                        <input type="text" id="i-${itemId}-preview-url" class="item-preview-url w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="مثال: https://example.com">
                    `;
                } else if (type === 'resources') {
                    // لا يوجد حقول إضافية
                }
            });
        }

        // مستمع أحداث رئيسي على حاوية العناصر للتعامل مع الأزرار الديناميكية
        document.getElementById('items-container').addEventListener('click', (e) => {
            const itemBlock = e.target.closest('.item-block');
            if (!itemBlock) return;

            const itemsContainer = document.getElementById('items-container');

            if (e.target.closest('.remove-item-btn')) {
                itemBlock.remove();
                updateItemNumbers();
            } else if (e.target.closest('.move-up-btn')) {
                const prevItem = itemBlock.previousElementSibling;
                if (prevItem) {
                    itemsContainer.insertBefore(itemBlock, prevItem);
                    updateItemNumbers();
                }
            } else if (e.target.closest('.move-down-btn')) {
                const nextItem = itemBlock.nextElementSibling;
                if (nextItem) {
                    itemsContainer.insertBefore(nextItem, itemBlock);
                    updateItemNumbers();
                }
            }
        });

        // دالة لتنظيف الكائن من الحقول الفارغة
        function cleanObject(obj) {
            const cleaned = {};
            for (const [key, value] of Object.entries(obj)) {
                // إذا كانت القيمة ليست فارغة (ليست null أو undefined أو string فارغة)
                if (value !== null && value !== undefined && value !== '') {
                    cleaned[key] = value;
                }
            }
            return cleaned;
        }

        // عند النقر على زر "توليد كود JSON"
        document.getElementById('generate-json-btn').addEventListener('click', () => {
            const pageName = document.getElementById('page-name-input').value.trim();
            const pageDescription = document.getElementById('page-description-input').value.trim();
            const pageUrl = document.getElementById('page-url-input').value.trim();
            const items = [];
            const itemsContainer = document.getElementById('items-container');

            if (!pageName) {
                showMessage('يرجى إدخال عنوان الصفحة.');
                return;
            }

            let hasError = false;

            itemsContainer.querySelectorAll('.item-block').forEach(iBlock => {
                const itemTitle = iBlock.querySelector('.item-title').value.trim();
                const itemDescription = iBlock.querySelector('.item-description').value.trim();
                const itemType = iBlock.querySelector('.item-type').value;

                if (!itemTitle) {
                    showMessage('يرجى ملء حقل عنوان العنصر لكل عنصر.');
                    hasError = true;
                    return;
                }

                // إنشاء كائن العنصر الأساسي
                const newItem = {
                    title: itemTitle,
                    description: itemDescription,
                    type: itemType
                };

                // إضافة الحقول الخاصة بنوع العنصر (فقط إذا كانت غير فارغة)
                if (itemType === 'documents') {
                    const previewUrl = iBlock.querySelector('.item-preview-url')?.value.trim() || '';
                    const downloadUrl = iBlock.querySelector('.item-download-url')?.value.trim() || '';
                    
                    if (previewUrl) newItem['preview_url'] = previewUrl;
                    if (downloadUrl) newItem['download_url'] = downloadUrl;
                } else if (itemType === 'videos') {
                    const previewUrl = iBlock.querySelector('.item-preview-url')?.value.trim() || '';
                    if (previewUrl) newItem['preview_url'] = previewUrl;
                } else if (itemType === 'quizzes') {
                    const previewUrl = iBlock.querySelector('.item-preview-url')?.value.trim() || '';
                    if (previewUrl) newItem['preview_url'] = previewUrl;
                } else if (itemType === 'links') {
                    const previewUrl = iBlock.querySelector('.item-preview-url')?.value.trim() || '';
                    if (previewUrl) newItem['preview_url'] = previewUrl;
                }
                
                // إضافة حقل وقت الإنشاء التلقائي لجميع العناصر
                newItem['time-ms'] = new Date().getTime().toString();
                
                // تنظيف العنصر من الحقول الفارغة قبل إضافته
                const cleanedItem = cleanObject(newItem);
                items.push(cleanedItem);
            });

            if (hasError) {
                return;
            }

            // إنشاء كائن الصفحة وتنظيفه من الحقول الفارغة
            const pageObject = cleanObject({
                name: pageName,
                description: pageDescription,
                url: pageUrl,
                items: items
            });

            const jsonString = JSON.stringify(pageObject, null, 2);

            document.getElementById('json-output').value = jsonString;
            document.getElementById('json-output-section').classList.remove('hidden');
        });

        // عند النقر على زر "نسخ"
        document.getElementById('copy-json-btn').addEventListener('click', () => {
            const outputTextarea = document.getElementById('json-output');
            outputTextarea.select();
            outputTextarea.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                showMessage('تم نسخ الكود بنجاح!');
            } catch (err) {
                showMessage('فشل النسخ. يرجى النسخ يدوياً.');
                console.error('Copy failed', err);
            }
        });

        // عند النقر على زر "تحويل كود JSON"
        document.getElementById('load-json-btn').addEventListener('click', () => {
            const jsonInput = document.getElementById('json-input-area').value;
            if (!jsonInput) {
                showMessage('يرجى لصق كود JSON في الحقل أولاً.');
                return;
            }

            try {
                const parsedJson = JSON.parse(jsonInput);
                if (!parsedJson) {
                    showMessage('كود JSON غير صالح أو فارغ.');
                    return;
                }

                // تعبئة حقول معلومات الصفحة
                document.getElementById('page-name-input').value = parsedJson.name || '';
                document.getElementById('page-description-input').value = parsedJson.description || '';
                document.getElementById('page-url-input').value = parsedJson.url || '';

                // مسح العناصر الحالية
                clearAllItems();

                // تعبئة العناصر الجديدة
                if (parsedJson.items && Array.isArray(parsedJson.items)) {
                    parsedJson.items.forEach(item => {
                        const newItemBlock = addItem();
                        const itemId = newItemBlock.id.split('-')[1];

                        // تعبئة الحقول المشتركة
                        newItemBlock.querySelector('.item-title').value = item.title || '';
                        newItemBlock.querySelector('.item-description').value = item.description || '';
                        
                        // تحديد نوع العنصر (استخدام القيمة الافتراضية إذا لم يكن النوع موجوداً)
                        const itemType = item.type || 'documents';
                        newItemBlock.querySelector('.item-type').value = itemType;
                        newItemBlock.querySelector('.item-type').dispatchEvent(new Event('change'));

                        // تعبئة الحقول الخاصة بنوع العنصر (إذا كانت موجودة في JSON)
                        if (itemType === 'documents') {
                            if (item.preview_url) newItemBlock.querySelector(`#i-${itemId}-preview-url`).value = item.preview_url;
                            if (item.download_url) newItemBlock.querySelector(`#i-${itemId}-download-url`).value = item.download_url;
                        } else if (itemType === 'videos') {
                            if (item.preview_url) newItemBlock.querySelector(`#i-${itemId}-preview-url`).value = item.preview_url;
                        } else if (itemType === 'quizzes') {
                            if (item.preview_url) newItemBlock.querySelector(`#i-${itemId}-preview-url`).value = item.preview_url;
                        } else if (itemType === 'links') {
                            if (item.preview_url) newItemBlock.querySelector(`#i-${itemId}-preview-url`).value = item.preview_url;
                        }
                        
                        // الحفاظ على الحقول الإضافية الأخرى (مثل time-ms) في JSON المستورد
                        // سيتم الاحتفاظ بها عند إعادة التوليد
                    });
                }
                showMessage('تم استيراد البيانات بنجاح!');
            } catch (e) {
                showMessage(`خطأ في تحليل كود JSON: ${e.message}`);
                console.error('JSON parsing error:', e);
            }
        });

        // إضافة عنصر افتراضي عند تحميل الصفحة
        window.onload = function() {
            addItem();
        }
    </script>
</body>
</html>
